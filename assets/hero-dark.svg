<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Jay Soni, Full-Stack Engineer and Solutions Architect">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#090d12"/><stop offset="1" stop-color="#151b23"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#f4bd32"/><stop offset="1" stop-color="#ffe69a"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#f4bd32" stop-opacity=".20"/><stop offset="1" stop-color="#f4bd32" stop-opacity="0"/></radialGradient>
    <radialGradient id="comet"><stop stop-color="#ffe69a" stop-opacity=".9"/><stop offset="1" stop-color="#f4bd32" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#7e8a99" stroke-opacity=".10"/></pattern>
    <clipPath id="card"><rect width="1200" height="320" rx="18"/></clipPath>
    <clipPath id="t0"><rect x="88" y="240" height="28" width="0"><animate attributeName="width" values="0;346;346;0;0" keyTimes="0;0.075;0.2;0.23125;1" dur="16s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="t1"><rect x="88" y="240" height="28" width="0"><animate attributeName="width" values="0;0;356;356;0;0" keyTimes="0;0.25;0.325;0.45;0.48125;1" dur="16s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="t2"><rect x="88" y="240" height="28" width="0"><animate attributeName="width" values="0;0;302;302;0;0" keyTimes="0;0.5;0.575;0.7;0.73125;1" dur="16s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="t3"><rect x="88" y="240" height="28" width="0"><animate attributeName="width" values="0;0;302;302;0;0" keyTimes="0;0.75;0.825;0.95;0.98125;1" dur="16s" repeatCount="indefinite"/></rect></clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1200" height="320" fill="url(#bg)"/>
    <rect width="1200" height="320" fill="url(#grid)"/>
    <g transform="translate(0 20)">
      <circle cx="990" cy="145" r="230" fill="url(#glow)"/>

      <g fill="#f4bd32">
        <circle cx="845" cy="300" r="1.6" opacity="0"><animate attributeName="cy" values="300;140" dur="7s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.7;0" dur="7s" repeatCount="indefinite"/></circle>
        <circle cx="905" cy="300" r="1.2" opacity="0"><animate attributeName="cy" values="300;110" dur="9s" begin="2s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.6;0" dur="9s" begin="2s" repeatCount="indefinite"/></circle>
        <circle cx="960" cy="290" r="1.8" opacity="0"><animate attributeName="cy" values="290;150" dur="6.5s" begin="4s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.7;0" dur="6.5s" begin="4s" repeatCount="indefinite"/></circle>
        <circle cx="1015" cy="300" r="1.3" opacity="0"><animate attributeName="cy" values="300;90" dur="8s" begin="1s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.6;0" dur="8s" begin="1s" repeatCount="indefinite"/></circle>
        <circle cx="1075" cy="290" r="1.6" opacity="0"><animate attributeName="cy" values="290;60" dur="7.5s" begin="3s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.7;0" dur="7.5s" begin="3s" repeatCount="indefinite"/></circle>
        <circle cx="1130" cy="300" r="1.2" opacity="0"><animate attributeName="cy" values="300;40" dur="10s" begin="5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.6;0" dur="10s" begin="5s" repeatCount="indefinite"/></circle>
      </g>

      <path id="route" d="M760 300 L820 250 L870 250 L920 190 L980 190 L1030 130 L1090 130 L1160 55" fill="none" stroke="#f4bd32" stroke-opacity=".16" stroke-width="20" stroke-linejoin="round" stroke-dasharray="520" stroke-dashoffset="520">
        <animate attributeName="stroke-dashoffset" values="520;0" dur="1.6s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.2 0.8 0.2 1"/>
      </path>
      <path d="M760 300 L820 250 L870 250 L920 190 L980 190 L1030 130 L1090 130 L1160 55" fill="none" stroke="url(#gold)" stroke-width="2.5" stroke-linejoin="round" stroke-dasharray="8 10">
        <animate attributeName="stroke-dashoffset" from="72" to="0" dur="5s" repeatCount="indefinite"/>
      </path>

      <g fill="none" stroke="#8d99a8" stroke-opacity=".38">
        <circle cx="980" cy="190" r="27"/>
        <circle cx="980" cy="190" r="47" stroke-dasharray="3 7"><animateTransform attributeName="transform" type="rotate" from="0 980 190" to="360 980 190" dur="30s" repeatCount="indefinite"/></circle>
      </g>
      <circle cx="1027" cy="190" r="2.5" fill="#f4bd32"><animateTransform attributeName="transform" type="rotate" from="0 980 190" to="-360 980 190" dur="9s" repeatCount="indefinite"/></circle>
      <circle cx="980" cy="190" r="4" fill="#ffe69a"><animate attributeName="r" values="3;6;3" dur="2.6s" repeatCount="indefinite"/></circle>

      <g fill="none" stroke="#f4bd32" stroke-opacity="0">
        <circle cx="820" cy="250" r="5"><animate attributeName="r" values="5;5;20;20" keyTimes="0;.092;.242;1" dur="5s" repeatCount="indefinite"/><animate attributeName="stroke-opacity" values="0;0;.9;0;0" keyTimes="0;.092;.1;.242;1" dur="5s" repeatCount="indefinite"/></circle>
        <circle cx="920" cy="190" r="5"><animate attributeName="r" values="5;5;20;20" keyTimes="0;.244;.394;1" dur="5s" repeatCount="indefinite"/><animate attributeName="stroke-opacity" values="0;0;.9;0;0" keyTimes="0;.244;.252;.394;1" dur="5s" repeatCount="indefinite"/></circle>
        <circle cx="1030" cy="130" r="5"><animate attributeName="r" values="5;5;20;20" keyTimes="0;.408;.558;1" dur="5s" repeatCount="indefinite"/><animate attributeName="stroke-opacity" values="0;0;.9;0;0" keyTimes="0;.408;.416;.558;1" dur="5s" repeatCount="indefinite"/></circle>
        <circle cx="1160" cy="55" r="5"><animate attributeName="r" values="5;5;30;30" keyTimes="0;.6;.8;1" dur="5s" repeatCount="indefinite"/><animate attributeName="stroke-opacity" values="0;0;.9;0;0" keyTimes="0;.6;.608;.8;1" dur="5s" repeatCount="indefinite"/></circle>
      </g>
      <g fill="#111820" stroke="#f4bd32" stroke-width="1.5">
        <circle cx="820" cy="250" r="5"><animate attributeName="fill" values="#111820;#111820;#ffe69a;#111820;#111820" keyTimes="0;.092;.1;.272;1" dur="5s" repeatCount="indefinite"/></circle>
        <circle cx="920" cy="190" r="5"><animate attributeName="fill" values="#111820;#111820;#ffe69a;#111820;#111820" keyTimes="0;.244;.252;.424;1" dur="5s" repeatCount="indefinite"/></circle>
        <circle cx="1030" cy="130" r="5"><animate attributeName="fill" values="#111820;#111820;#ffe69a;#111820;#111820" keyTimes="0;.408;.416;.588;1" dur="5s" repeatCount="indefinite"/></circle>
        <circle cx="1160" cy="55" r="5"><animate attributeName="fill" values="#111820;#111820;#ffe69a;#111820;#111820" keyTimes="0;.6;.608;.85;1" dur="5s" repeatCount="indefinite"/></circle>
      </g>
      <g font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace" font-size="12" letter-spacing="2" text-anchor="end" fill="#8d99a8">
        <text x="808" y="240">DESIGN<animate attributeName="fill" values="#8d99a8;#8d99a8;#f4bd32;#8d99a8;#8d99a8" keyTimes="0;.092;.1;.272;1" dur="5s" repeatCount="indefinite"/></text>
        <text x="908" y="180">BUILD<animate attributeName="fill" values="#8d99a8;#8d99a8;#f4bd32;#8d99a8;#8d99a8" keyTimes="0;.244;.252;.424;1" dur="5s" repeatCount="indefinite"/></text>
        <text x="1018" y="120">SHIP<animate attributeName="fill" values="#8d99a8;#8d99a8;#f4bd32;#8d99a8;#8d99a8" keyTimes="0;.408;.416;.588;1" dur="5s" repeatCount="indefinite"/></text>
        <text x="1148" y="45">SCALE<animate attributeName="fill" values="#8d99a8;#8d99a8;#f4bd32;#8d99a8;#8d99a8" keyTimes="0;.6;.608;.85;1" dur="5s" repeatCount="indefinite"/></text>
      </g>

      <g opacity="0">
        <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;.03;.58;.66;1" dur="5s" repeatCount="indefinite"/>
        <animateMotion dur="5s" repeatCount="indefinite" calcMode="linear" keyPoints="0;1;1" keyTimes="0;.6;1"><mpath href="#route"/></animateMotion>
        <circle r="16" fill="url(#comet)"/>
        <circle r="4" fill="#fff4cc"/>
      </g>
    </g>
  </g>

  <g font-family="Arial, Helvetica, sans-serif">
    <circle cx="64" cy="53" r="5" fill="#3fb950"><animate attributeName="fill-opacity" values="1;0.35;1" dur="1.6s" repeatCount="indefinite"/></circle>
    <circle cx="64" cy="53" r="5" fill="none" stroke="#3fb950">
      <animate attributeName="r" values="5;13" dur="1.6s" repeatCount="indefinite"/>
      <animate attributeName="stroke-opacity" values="0.7;0" dur="1.6s" repeatCount="indefinite"/>
    </circle>
    <text x="80" y="58" fill="#3fb950" font-size="14" letter-spacing="2">OPEN TO WORK</text>

    <text x="54" y="150" fill="#f4f6f8" font-size="72" font-weight="700">Jay <tspan fill="#f4bd32">Soni</tspan></text>
    <rect x="58" y="172" width="4" height="36" rx="2" fill="#f4bd32"/>
    <text x="76" y="199" fill="#e8edf3" font-size="28">Full-Stack Engineer <tspan fill="#778493">/</tspan> Solutions Architect</text>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace" font-size="18" fill="#9da7b3">
    <text x="59" y="260" fill="#f4bd32">$</text>
    <text x="88" y="260" textLength="346" lengthAdjust="spacing" clip-path="url(#t0)">building full-stack applications</text>
    <text x="88" y="260" textLength="356" lengthAdjust="spacing" clip-path="url(#t1)">architecting cloud infrastructure</text>
    <text x="88" y="260" textLength="302" lengthAdjust="spacing" clip-path="url(#t2)">integrating AI into products</text>
    <text x="88" y="260" textLength="302" lengthAdjust="spacing" clip-path="url(#t3)">shipping ideas to production</text>
    <rect x="88" y="244" width="11" height="21" fill="#f4bd32">
      <animate attributeName="x" values="88;434;434;88;88;444;444;88;88;390;390;88;88;390;390;88;88" keyTimes="0;0.075;0.2;0.23125;0.25;0.325;0.45;0.48125;0.5;0.575;0.7;0.73125;0.75;0.825;0.95;0.98125;1" dur="16s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1s" repeatCount="indefinite"/>
    </rect>
  </g>

  <rect x="1" y="1" width="1198" height="318" rx="17" fill="none" stroke="#303945"/>
</svg>
