<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="150" viewBox="0 0 1200 150" role="img" aria-label="Build with intent. Ship with care. Keep learning.">
  <defs>
    <linearGradient id="line" x1="0" x2="1"><stop stop-color="#d97706" stop-opacity="0"/><stop offset=".5" stop-color="#d97706"/><stop offset="1" stop-color="#d97706" stop-opacity="0"/></linearGradient>
  </defs>
  <path d="M0 12H1200" stroke="url(#line)" stroke-width="1.5"/>
  <circle cx="0" cy="12" r="3.5" fill="#d97706"><animate attributeName="cx" values="0;1200;0" dur="12s" repeatCount="indefinite"/></circle>
  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
    <text x="600" y="50" font-size="17" letter-spacing="3" fill="#57606a">BUILD WITH INTENT · SHIP WITH CARE · KEEP LEARNING</text>
    <text x="600" y="76" font-size="13" letter-spacing="2" fill="#b45309">JAY SONI / ENGINEERING</text>
  </g>
  <g fill="#f59e0b">
    <path fill-opacity="0.08" d="M0 118 Q150 96 300 118 T600 118 T900 118 T1200 118 T1500 118 T1800 118 V150 H0 Z">
      <animateTransform attributeName="transform" type="translate" values="0 0;-600 0" dur="14s" repeatCount="indefinite"/>
    </path>
    <path fill-opacity="0.14" d="M0 128 Q150 110 300 128 T600 128 T900 128 T1200 128 T1500 128 T1800 128 V150 H0 Z">
      <animateTransform attributeName="transform" type="translate" values="-600 0;0 0" dur="10s" repeatCount="indefinite"/>
    </path>
    <path fill-opacity="0.24" d="M0 138 Q150 126 300 138 T600 138 T900 138 T1200 138 T1500 138 T1800 138 V150 H0 Z">
      <animateTransform attributeName="transform" type="translate" values="0 0;-600 0" dur="7s" repeatCount="indefinite"/>
    </path>
  </g>
</svg>
