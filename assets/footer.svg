<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="140" viewBox="0 0 1200 140" role="img" aria-label="Thanks for stopping by">
  <defs>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#14b8a6"/>
      <stop offset="0.5" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>

  <text x="600" y="34" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace" font-size="19" letter-spacing="2" fill="#8b949e">THANKS FOR STOPPING BY
    <animate attributeName="fill-opacity" values="0.55;1;0.55" dur="4s" repeatCount="indefinite"/>
  </text>

  <g fill="url(#wave)">
    <path fill-opacity="0.18" d="M0 92 Q150 62 300 92 T600 92 T900 92 T1200 92 T1500 92 T1800 92 V140 H0 Z">
      <animateTransform attributeName="transform" type="translate" values="0 0;-600 0" dur="14s" repeatCount="indefinite"/>
    </path>
    <path fill-opacity="0.3" d="M0 104 Q150 80 300 104 T600 104 T900 104 T1200 104 T1500 104 T1800 104 V140 H0 Z">
      <animateTransform attributeName="transform" type="translate" values="-600 0;0 0" dur="10s" repeatCount="indefinite"/>
    </path>
    <path fill-opacity="0.55" d="M0 118 Q150 100 300 118 T600 118 T900 118 T1200 118 T1500 118 T1800 118 V140 H0 Z">
      <animateTransform attributeName="transform" type="translate" values="0 0;-600 0" dur="7s" repeatCount="indefinite"/>
    </path>
  </g>
</svg>
