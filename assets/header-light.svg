<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Jay Soni, Full-Stack Engineer and Solutions Architect">
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0" spreadMethod="reflect">
      <stop offset="0" stop-color="#0d9488"/>
      <stop offset="0.5" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#7c3aed"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="0 0;1 0;0 0" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d9488"/>
      <stop offset="0.5" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.85" cy="0.2" r="0.7">
      <stop offset="0" stop-color="#2563eb" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#2563eb" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#1f2328" fill-opacity="0.07"/>
    </pattern>
    <clipPath id="card"><rect width="1200" height="320" rx="20"/></clipPath>
    <clipPath id="t0"><rect x="112" y="262" height="32" width="0"><animate attributeName="width" values="0;384;384;0;0" keyTimes="0;0.075;0.2;0.23125;1" dur="16s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="t1"><rect x="112" y="262" height="32" width="0"><animate attributeName="width" values="0;0;396;396;0;0" keyTimes="0;0.25;0.325;0.45;0.48125;1" dur="16s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="t2"><rect x="112" y="262" height="32" width="0"><animate attributeName="width" values="0;0;336;336;0;0" keyTimes="0;0.5;0.575;0.7;0.73125;1" dur="16s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="t3"><rect x="112" y="262" height="32" width="0"><animate attributeName="width" values="0;0;336;336;0;0" keyTimes="0;0.75;0.825;0.95;0.98125;1" dur="16s" repeatCount="indefinite"/></rect></clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1200" height="320" fill="#f6f8fa"/>
    <rect width="1200" height="320" fill="url(#dots)"/>
    <rect width="1200" height="320" fill="url(#glow)"/>

    <g fill="none" stroke="url(#ring)" stroke-opacity="0.22">
      <circle cx="1030" cy="160" r="60"/>
      <circle cx="1030" cy="160" r="95" stroke-opacity="0.14"/>
      <circle cx="1030" cy="160" r="130" stroke-opacity="0.08"/>
    </g>

    <circle cx="1030" cy="160" r="5" fill="none" stroke="#2563eb">
      <animate attributeName="r" values="5;130" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="stroke-opacity" values="0.3;0" dur="5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1030" cy="160" r="4" fill="#2563eb" fill-opacity="0.8">
      <animate attributeName="r" values="4;6;4" dur="2.5s" repeatCount="indefinite"/>
    </circle>

    <g fill-opacity="0.75">
      <g>
        <circle cx="1090" cy="160" r="3.5" fill="#0d9488"/>
        <animateTransform attributeName="transform" type="rotate" from="0 1030 160" to="360 1030 160" dur="14s" repeatCount="indefinite"/>
      </g>
      <g>
        <circle cx="935" cy="160" r="3.5" fill="#7c3aed"/>
        <animateTransform attributeName="transform" type="rotate" from="360 1030 160" to="0 1030 160" dur="22s" repeatCount="indefinite"/>
      </g>
      <g>
        <circle cx="1160" cy="160" r="2.5" fill="#2563eb"/>
        <animateTransform attributeName="transform" type="rotate" from="90 1030 160" to="450 1030 160" dur="34s" repeatCount="indefinite"/>
      </g>
    </g>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace">
    <text x="80" y="92" font-size="18" letter-spacing="3" fill="#59636e">HELLO, I'M</text>
    <circle cx="244" cy="86" r="5" fill="#1a7f37">
      <animate attributeName="fill-opacity" values="1;0.35;1" dur="1.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="244" cy="86" r="5" fill="none" stroke="#1a7f37">
      <animate attributeName="r" values="5;13" dur="1.6s" repeatCount="indefinite"/>
      <animate attributeName="stroke-opacity" values="0.7;0" dur="1.6s" repeatCount="indefinite"/>
    </circle>
    <text x="260" y="92" font-size="16" letter-spacing="1.5" fill="#1a7f37">OPEN TO WORK</text>
  </g>

  <text x="76" y="168" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="76" font-weight="700" letter-spacing="-1.5" fill="#1f2328">Jay Soni</text>
  <rect x="80" y="192" width="84" height="5" rx="2.5" fill="url(#accent)">
    <animate attributeName="width" values="84;132;84" dur="6s" repeatCount="indefinite"/>
  </rect>
  <text x="80" y="240" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="30" fill="#24292f">Full-Stack Engineer &amp; Solutions Architect</text>

  <g font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace" font-size="20" fill="#4b535c">
    <text x="80" y="284" fill="#0d9488">$</text>
    <text x="112" y="284" textLength="384" lengthAdjust="spacing" clip-path="url(#t0)">building full-stack applications</text>
    <text x="112" y="284" textLength="396" lengthAdjust="spacing" clip-path="url(#t1)">architecting cloud infrastructure</text>
    <text x="112" y="284" textLength="336" lengthAdjust="spacing" clip-path="url(#t2)">integrating AI into products</text>
    <text x="112" y="284" textLength="336" lengthAdjust="spacing" clip-path="url(#t3)">shipping ideas to production</text>
    <rect x="112" y="266" width="12" height="23" fill="#2563eb">
      <animate attributeName="x" values="112;496;496;112;112;508;508;112;112;448;448;112;112;448;448;112;112" keyTimes="0;0.075;0.2;0.23125;0.25;0.325;0.45;0.48125;0.5;0.575;0.7;0.73125;0.75;0.825;0.95;0.98125;1" dur="16s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
