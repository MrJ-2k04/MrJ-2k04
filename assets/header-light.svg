<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Jay Soni, Full-Stack Engineer and Solutions Architect">
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0d9488"/>
      <stop offset="0.5" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.15" r="0.75">
      <stop offset="0" stop-color="#2563eb" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#2563eb" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#1f2328" fill-opacity="0.08"/>
    </pattern>
    <clipPath id="card"><rect width="1200" height="320" rx="20"/></clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1200" height="320" fill="#f6f8fa"/>
    <rect width="1200" height="320" fill="url(#dots)"/>
    <rect width="1200" height="320" fill="url(#glow)"/>

    <g fill="none" stroke="url(#accent)" stroke-opacity="0.4">
      <circle cx="1010" cy="160" r="70"/>
      <circle cx="1010" cy="160" r="110" stroke-opacity="0.25"/>
      <circle cx="1010" cy="160" r="150" stroke-opacity="0.14"/>
    </g>
    <circle cx="1010" cy="160" r="5" fill="#2563eb"/>
    <circle cx="1080" cy="160" r="3.5" fill="#0d9488"/>
    <circle cx="932" cy="122" r="3.5" fill="#7c3aed"/>
    <circle cx="1104" cy="240" r="3" fill="#2563eb" fill-opacity="0.8"/>
  </g>

  <text x="80" y="104" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace" font-size="16" letter-spacing="3" fill="#59636e">HELLO, I'M</text>
  <text x="76" y="178" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="72" font-weight="700" letter-spacing="-1.5" fill="#1f2328">Jay Soni</text>
  <rect x="80" y="202" width="84" height="4" rx="2" fill="url(#accent)"/>
  <text x="80" y="244" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="24" fill="#31373d">Full-Stack Engineer &amp; Solutions Architect</text>
  <text x="80" y="276" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace" font-size="15" fill="#59636e">cloud-native systems · applied AI · Ahmedabad, India</text>
</svg>
