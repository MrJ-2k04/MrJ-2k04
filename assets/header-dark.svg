<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Jay Soni, Full-Stack Engineer and Solutions Architect">
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0" spreadMethod="reflect">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="0.5" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#a78bfa"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="0 0;1 0;0 0" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="0.5" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.15" r="0.75">
      <stop offset="0" stop-color="#60a5fa" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#60a5fa" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#c9d1d9" fill-opacity="0.07"/>
    </pattern>
    <clipPath id="card"><rect width="1200" height="320" rx="20"/></clipPath>
    <clipPath id="t0"><rect x="104" y="258" height="24" width="0"><animate attributeName="width" values="0;261;261;0;0" keyTimes="0;0.075;0.2;0.23125;1" dur="16s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="t1"><rect x="104" y="258" height="24" width="0"><animate attributeName="width" values="0;0;243;243;0;0" keyTimes="0;0.25;0.325;0.45;0.48125;1" dur="16s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="t2"><rect x="104" y="258" height="24" width="0"><animate attributeName="width" values="0;0;171;171;0;0" keyTimes="0;0.5;0.575;0.7;0.73125;1" dur="16s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="t3"><rect x="104" y="258" height="24" width="0"><animate attributeName="width" values="0;0;243;243;0;0" keyTimes="0;0.75;0.825;0.95;0.98125;1" dur="16s" repeatCount="indefinite"/></rect></clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1200" height="320" fill="#0d1117"/>
    <rect width="1200" height="320" fill="url(#dots)"/>
    <rect width="1200" height="320" fill="url(#glow)"/>

    <g fill="none" stroke="url(#ring)" stroke-opacity="0.35">
      <circle cx="1010" cy="160" r="70"/>
      <circle cx="1010" cy="160" r="110" stroke-opacity="0.22"/>
      <circle cx="1010" cy="160" r="150" stroke-opacity="0.12"/>
    </g>

    <circle cx="1010" cy="160" r="6" fill="none" stroke="#60a5fa" stroke-width="1.5">
      <animate attributeName="r" values="6;150" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="stroke-opacity" values="0.6;0" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1010" cy="160" r="5" fill="#60a5fa">
      <animate attributeName="r" values="5;7;5" dur="2s" repeatCount="indefinite"/>
    </circle>

    <g>
      <circle cx="1080" cy="160" r="4" fill="#2dd4bf"/>
      <animateTransform attributeName="transform" type="rotate" from="0 1010 160" to="360 1010 160" dur="12s" repeatCount="indefinite"/>
    </g>
    <g>
      <circle cx="900" cy="160" r="4" fill="#a78bfa"/>
      <circle cx="1120" cy="160" r="2.5" fill="#a78bfa" fill-opacity="0.6"/>
      <animateTransform attributeName="transform" type="rotate" from="360 1010 160" to="0 1010 160" dur="20s" repeatCount="indefinite"/>
    </g>
    <g>
      <circle cx="1160" cy="160" r="3" fill="#60a5fa" fill-opacity="0.8"/>
      <animateTransform attributeName="transform" type="rotate" from="90 1010 160" to="450 1010 160" dur="32s" repeatCount="indefinite"/>
    </g>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace">
    <text x="80" y="104" font-size="16" letter-spacing="3" fill="#8b949e">HELLO, I'M</text>
    <circle cx="228" cy="98" r="4" fill="#3fb950">
      <animate attributeName="fill-opacity" values="1;0.35;1" dur="1.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="228" cy="98" r="4" fill="none" stroke="#3fb950">
      <animate attributeName="r" values="4;11" dur="1.6s" repeatCount="indefinite"/>
      <animate attributeName="stroke-opacity" values="0.7;0" dur="1.6s" repeatCount="indefinite"/>
    </circle>
    <text x="242" y="104" font-size="13" letter-spacing="1.5" fill="#3fb950">OPEN TO WORK</text>
  </g>

  <text x="76" y="178" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="72" font-weight="700" letter-spacing="-1.5" fill="#f0f6fc">Jay Soni</text>
  <rect x="80" y="202" width="84" height="4" rx="2" fill="url(#accent)">
    <animate attributeName="width" values="84;132;84" dur="6s" repeatCount="indefinite"/>
  </rect>
  <text x="80" y="244" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="24" fill="#c9d1d9">Full-Stack Engineer &amp; Solutions Architect</text>

  <g font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace" font-size="15" fill="#8b949e">
    <text x="80" y="276" fill="#2dd4bf">$</text>
    <text x="104" y="276" textLength="261" lengthAdjust="spacing" clip-path="url(#t0)">building cloud-native systems</text>
    <text x="104" y="276" textLength="243" lengthAdjust="spacing" clip-path="url(#t1)">shipping AI into production</text>
    <text x="104" y="276" textLength="171" lengthAdjust="spacing" clip-path="url(#t2)">architecting on AWS</text>
    <text x="104" y="276" textLength="243" lengthAdjust="spacing" clip-path="url(#t3)">turning ideas into products</text>
    <rect x="104" y="262" width="9" height="18" fill="#60a5fa">
      <animate attributeName="x" values="104;365;365;104;104;347;347;104;104;275;275;104;104;347;347;104;104" keyTimes="0;0.075;0.2;0.23125;0.25;0.325;0.45;0.48125;0.5;0.575;0.7;0.73125;0.75;0.825;0.95;0.98125;1" dur="16s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
